name: CI

# The gates from specs/001-framework-foundation/contracts/quality-gates.md.
#
# Every job here is blocking, with exactly one written exception. No other `continue-on-error`
# appears in this file and none should: a gate that tolerates failure is documentation, not a gate.
#
# The exception is `browser-playback`, added in feature 014. It measures frames in a real engine,
# and a threshold armed before its run-to-run variance is known is the flake feature 013 spent
# itself removing — at a larger scale, because frame timing is noisier than anything it removed.
# It reports and does not block until that variance is recorded and a bound is argued from it
# (FR-007). **When that happens, this exception is retired and the job blocks like every other.**
#
# The four gates that began as placeholders (theme-values, parity, a11y, perf)
# existed from Wave 1 so that arming them later was a one-line change to one
# script rather than new infrastructure built under deadline pressure. Three are
# now armed — perf in Wave 1 and again in Wave 3, theme-values and a11y in Wave 2.
# Only parity is still inert, and it names the wave that arms it: there is no
# editor yet, so there is nothing for a player to diverge from.
#
# Measured wall-clock, all jobs in parallel after `setup`: ~2 min.
# Budget is 5 min (SC-005). If it approaches that, parallelise further — do not
# move a gate out of the blocking set.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The reference environment for every timing budget in the spec.
  NODE_VERSION: '24'

jobs:
  # Gate 1 — typecheck
  typecheck:
    name: 'Gate 1 · typecheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  # Gate 2a/2c — per-file lint, including the core/UI boundary and the
  # determinism rules. 2c (no hard-coded theme values) is a placeholder.
  lint:
    name: 'Gate 2a · lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .

  # Gate 2b — graph boundaries: package direction and cycles.
  boundaries:
    name: 'Gate 2b · boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:boundaries

  # Gates 3, 4, 9 — tests, coverage floors, determinism.
  test:
    name: 'Gates 3,4,9 · tests + coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage

  # Gate 8 — the package is actually consumable as published, plus the
  # stronger consumer-facing claim that core loads with no UI framework.
  packaging:
    name: 'Gate 8 · packaging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:packaging
      - run: pnpm check:isolation
      # Feature 005: the player must render with the editor absent from disk. The
      # dependency rule proves nothing imports studio; this proves the player does not
      # need it, which is the claim a learner's payload actually rests on (FR-049).
      - run: pnpm check:studio-isolation
      # Feature 011: the web-component adapter must install and import with no UI framework
      # anywhere in the tree, and in a process with no DOM. The second half is not incidental —
      # `class extends HTMLElement` is evaluated at module load, so an unguarded base class
      # crashes every server that imports the package, and no happy-dom suite can see it.
      - run: pnpm check:element-isolation
      - run: pnpm check:data-model

  # Gate 10 — a format change must ship its migration in the same revision.
  migrations:
    name: 'Gate 10 · schema/migration pairing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the check needs a merge base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:migrations
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}

  # Gates 2c, 5, 6, 7. Three of the four are armed as of feature 003 — the accessibility
  # and theme-value gates now check real subject matter, so this job needs a built
  # workspace and the installed dependencies it previously did without. Only parity is
  # still a placeholder, and it names the wave that arms it.
  quality-gates:
    name: 'Gates 2c,5,6,7 · a11y, theme, perf, parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tools/scripts/gates/run-all.mjs

  # Feature 003 T008: the business-rule tally, derived from the filesystem rather than
  # asserted in prose. Blocking, because four analysis passes found that count wrong and
  # two of those errors were introduced while correcting the previous one.
  rule-coverage:
    name: 'Gate 11 · business-rule coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rules
      - run: pnpm check:docs
      # The build is for `check:agreement` below, not for the two checks above — it spawns a
      # vitest suite that imports `@cuestack/core` and `@cuestack/react`, both of which resolve
      # to `dist`. Without it the suite fails to import and the report is empty.
      - run: pnpm build
      # Reports what the two adapters disagree about; exits zero whatever it finds (FR-011).
      # Here so the report is in every build's log, not to gate on it — see the script's header.
      - run: pnpm check:agreement

  # The published example, built the way a consumer's app is. The only real RSC boundary in
  # the repository, and therefore the only place a wrongly ordered exports map or a hook on
  # the server path is observable — neither of which throws in a unit test.
  example-build:
    name: 'Gate 12 · the example app builds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @cuestack/example-nextjs build

  # The MVP acceptance scenarios from the framework specification, §34.
  #
  # A named job rather than four files inside the test run, because these are the promises
  # the product was specified against and "the tests passed" does not say whether *they*
  # did. A/B/C/F only: D and E need an editor and a publishing pipeline, and listing this
  # job as "A–F" would be false.
  #
  # It re-runs four files the `test` job already ran, which is deliberate duplication. The
  # cost is seconds; what it buys is a red check whose name says which promise broke.
  acceptance:
    name: 'Acceptance · MVP scenarios A, B, C, F'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run --project @cuestack/react test/acceptance

  # Frames from a real engine, and the paths only a browser has. Reports; does not block — see
  # the exception noted at the top of this file.
  #
  # **WebKit is verified only here.** It needs libevent, libavif and libmanette, which
  # `--with-deps` installs and a developer machine generally does not have — so a WebKit-only
  # regression is invisible locally *and* non-blocking here. That is a known, accepted gap, not an
  # oversight: read this job's log when a media or layout change lands, because nothing else will
  # tell you.
  browser-playback:
    name: 'Browser · playback frames and browser-only paths (reports)'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The slowest step in the workflow. Keyed by the lockfile so an unchanged Playwright version
      # does not re-download three engines on every run.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps
      - run: pnpm check:browser
      - run: pnpm check:browser --behaviour

  # The gates' own negative controls: proof each gate would go red.
  gate-self-test:
    name: 'Meta · gates fail when they should'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:gates
